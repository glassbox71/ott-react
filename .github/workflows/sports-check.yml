name: Sports checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  sports:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run test:sports
      - run: npx eslint src/pages/Sports.jsx src/features/sports/*.js src/features/sports/*.jsx
      - run: npm run build
      - name: Two-user Firestore integration and rules
        run: npx --yes firebase-tools@15.34.0 emulators:exec --only firestore --project demo-ott-sports --config firebase.emulators.json 'test -n "$FIRESTORE_EMULATOR_HOST" && npm run test:sports:chat'
